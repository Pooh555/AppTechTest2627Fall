appId: ${MAESTRO_APP_ID}
---
- tapOn:
    id: "course-search"
- inputText: "comp4211"
- tapOn:
    id: "department-filter"
- swipe:
    from:
      id: "term-selector"
    direction: LEFT
    duration: 500
- assertVisible: "Winter"
- tapOn:
    id: "department-COMP"
- tapOn:
    id: "course-row-COMP-4211"
- assertVisible: "Prerequisites"
- tapOn:
    id: "open-prereq-explorer"
- assertVisible: "Requires"
- tapOn:
    text: "Expand COMP 4211"
- tapOn:
    text: "Expand COMP 4211"
- tapOn:
    text: "COMP 4211"
